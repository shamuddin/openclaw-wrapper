name: Docker Build

on:
  push:
    branches: [main]
    paths:
      - "apps/adapter/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "apps/adapter/Dockerfile"
  pull_request:
    paths:
      - "apps/adapter/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "package.json"
      - "apps/adapter/Dockerfile"

jobs:
  build:
    name: Build adapter image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build adapter image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/adapter/Dockerfile
          push: false
          tags: openclaw-wrapper/adapter:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
