name: Documentation improvement
description: Report missing, incorrect, or unclear docs.
title: "[Docs]: "
labels:
  - documentation
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is unclear, missing, or incorrect?
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Location
      description: Link or file path to the relevant page or doc.
      placeholder: README.md or CONTRIBUTING.md
    validations:
      required: true
  - type: textarea
    id: fix
    attributes:
      label: Suggested improvement
      description: How should the docs be improved?
