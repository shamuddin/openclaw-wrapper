name: Feature request
description: Propose a new capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.
        Helpful feature requests explain the **user problem first** and the implementation idea second.

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem, workflow gap, or pain point are you trying to address?
      placeholder: Describe the user or developer problem clearly.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: Describe the behavior, UI, API, or workflow you want.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider and why are they weaker?
      placeholder: Describe alternative solutions or workarounds.

  - type: dropdown
    id: scope
    attributes:
      label: Affected area
      description: Which part of the project would this touch?
      multiple: true
      options:
        - Web UI / Canvas
        - Adapter / API
        - Schemas / Contracts
        - Channels
        - Flows / Runs
        - Memory
        - Auth / Workspaces
        - Ops / Gateway
        - Plugins / Extensions
        - Documentation
        - Infrastructure / CI
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: |
        Who benefits from this? How often does the pain occur?
        Include affected users, severity, frequency, and practical consequences.
      placeholder: |
        Affected: All users creating multi-step flows
        Severity: Medium (workaround exists but is tedious)
        Frequency: Every time a flow has more than 5 nodes
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence or examples
      description: Prior art, links, screenshots, mockups, or references.
      placeholder: Comparable behavior in other tools, sample config, or screenshot of the current limitation.

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Constraints, backward compatibility notes, or anything else.
