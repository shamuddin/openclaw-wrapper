name: Feature request
description: Suggest a product, developer-experience, or documentation improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement.

        Helpful feature requests explain the user problem first and the implementation idea second.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What problem, workflow gap, or pain point are you trying to address?
      placeholder: Describe the user or maintainer problem clearly.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
      placeholder: Describe the behavior, UI, API, or workflow you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
  - type: textarea
    id: scope
    attributes:
      label: Scope and impact
      description: Who benefits from this, and what part of the repo would it touch?
